# 只在客戶端真的要求升級（WebSocket 交握）時才把 Connection 設為
# "upgrade"，一般 HTTP 請求維持預設的 "close"，兩者共用同一個
# location /api/ 也不會互相干擾。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location = /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/live_guide 是 WebSocket（相機開著就持續連線給 Gemini Live
        # 看畫面），沒有這兩個 header nginx 不會轉發升級請求，連線會直接
        # 被當成普通 HTTP 處理而失敗。其餘 /api/* 走一般 HTTP，這兩個
        # header 不影響它們。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
