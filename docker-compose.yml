services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      GIN_MODE: release
      STOPS_INDEX_PATH: /data/stops.json
      GCP_PROJECT: ${GCP_PROJECT:-devjam26aug17tpe-1280}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      TTS_BUCKET: ${TTS_BUCKET:-devjam26aug17tpe-1280-tts-audio}
    # GCP 憑證怎麼掛（本機用哪個使用者的 ADC、正式站用哪把 key）因環境而
    # 異，交給各自的 docker-compose.override.yml 處理，這份共用檔案不綁
    # 死任何一邊（先前 Windows 專屬的 ${USERPROFILE} 寫死在這裡，導致部署
    # 到 Linux 主機時路徑直接解析失敗）。
    expose:
      - "8080"
    ports:
      - "${API_PORT:-8081}:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    environment:
      PORT: "5000"
    expose:
      - "5000"
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - frontend
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
